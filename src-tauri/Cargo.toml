[package]
name = "gravitation"
version = "5.9.0"
description = "Gravitation — SSH client: terminals, SFTP, keys, scripts and proxies"
authors = ["Gravitation"]
edition = "2021"

[lib]
name = "gravitation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }
base64 = "0.22"
urlencoding = "2"
# The default aws-lc-sys crypto needs NASM on Windows; ring builds with the
# plain MSVC toolchain, so pin it.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.0"
# Direct access to the app database (credentials are read in Rust, never
# sent from the webview). Same version the sql plugin uses: one sqlx build.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
regex = "1"
keyring = "4.2.0"
aes-gcm = "0.11.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Sync (sync.rs): end-to-end encryption and the HTTPS client. Versions match
# the ones russh already pulls in; reqwest 0.12 + rustls uses ring (no NASM).
serde_json = "1"
argon2 = "0.6"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = "3.0.0"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"] }


# WebView2 hooks (same versions wry uses): take Ctrl+F / Ctrl+G / F3 away
# from the browser's own find bar so the app's search gets them.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# Argon2 (sync key derivation) is unusably slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
